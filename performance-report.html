<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>実績報告書</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ==================== 変数・リセット ==================== */
    :root {
      --bg:         #fdf6ec;
      --text:       #4a3f35;
      --muted:      #8c7c6b;
      --primary:    #e76f51;
      --primary-lt: #fcece8;
      --card-bg:    #fff0e3;
      --border:     #dcbfa6;
      --brown-dark: #4a3f35;
      --brown-mid:  #6b4f3a;
      --green:      #2a9d8f;
      --green-lt:   #e6f7f5;
      --blue:       #457b9d;
      --blue-lt:    #edf3f8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 5rem;
    }
    button { cursor: pointer; font-family: inherit; }
    input, select { font-family: inherit; }
    .hidden { display: none !important; }

    /* ==================== ページヘッダー ==================== */
    .page-header {
      background: var(--brown-dark);
      color: white;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .page-header i { font-size: 1.2rem; color: #f4a261; }
    .page-header .title   { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .page-header .subtitle { font-size: 0.75rem; opacity: 0.7; }

    /* ==================== コントロールバー ==================== */
    .ctrl-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .ctrl-bar label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctrl-bar input[type="month"],
    .ctrl-bar select {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      font-size: 0.9rem;
      background: white;
      color: var(--text);
    }
    .ctrl-bar input[type="month"]:focus,
    .ctrl-bar select:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary {
      background: white;
      color: var(--brown-mid);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f0e8e0; }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }

    /* ==================== ローディング / 空状態 ==================== */
    .state-box {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .state-box i { font-size: 2rem; display: block; margin-bottom: 0.6rem; color: var(--border); }
    .spinner {
      display: inline-block;
      width: 2rem; height: 2rem;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 0.6rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==================== 集計結果エリア ==================== */
    .result-area { padding: 1rem; }

    /* 集計PDF用ヘッダー（html2canvas キャプチャ時のみ表示） */
    .pdf-header {
      display: none;
      text-align: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--brown-dark);
    }
    .pdf-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--brown-dark); }
    .pdf-header p  { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    /* 利用者ごとのカード */
    .user-section {
      margin-bottom: 1.5rem;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 4px rgba(139,115,95,0.08);
    }
    .user-section-header {
      background: var(--brown-dark);
      color: white;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .user-section-header i { color: #f4a261; font-size: 0.85rem; }
    .user-total-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
    }
    /* 利用者カード下部の目立つ「報告書PDF」ボタン */
    .btn-report-prominent {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.65rem 1.2rem;
      background: var(--primary);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      border-top: 1px solid rgba(231,111,81,0.3);
      letter-spacing: 0.03em;
    }
    .btn-report-prominent:hover { opacity: 0.85; }

    /* 集計テーブル */
    .summary-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #e4d5c5;
      padding: 0.35rem 0.6rem;
      white-space: nowrap;
    }
    .summary-table thead tr { background: var(--card-bg); }
    .summary-table thead th {
      font-weight: 700;
      color: var(--brown-mid);
      text-align: center;
    }
    .summary-table tbody td:first-child {
      font-weight: 600;
      color: var(--text);
      background: #faf5ef;
      text-align: center;
    }
    .task-cell {
      cursor: pointer;
      color: var(--blue) !important;
      text-decoration: underline;
      text-decoration-style: dashed;
      text-underline-offset: 2px;
    }
    .task-cell:hover { background: var(--blue-lt) !important; }
    .summary-table tbody td { text-align: center; color: var(--muted); }
    .summary-table tbody td.has-count { color: var(--text); font-weight: 600; }
    .summary-table tfoot tr { background: var(--primary-lt); }
    .summary-table tfoot td {
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      border-top: 2px solid var(--primary);
    }
    .summary-table tfoot td:first-child { text-align: left; color: var(--brown-dark); }
    .summary-table .col-total {
      background: #fef3ee;
      font-weight: 700;
      color: var(--primary) !important;
      border-left: 2px solid var(--primary);
    }
    .summary-table tfoot .col-total { background: var(--primary); color: white !important; }

    /* ==================== 月合計サマリー ==================== */
    .monthly-summary {
      margin-bottom: 1.5rem;
      background: var(--green-lt);
      border: 1.5px solid #b2dfdb;
      border-radius: 10px;
      overflow: hidden;
    }
    .monthly-summary-header {
      background: var(--green);
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .monthly-summary-body {
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .summary-chip {
      background: white;
      border: 1px solid #b2dfdb;
      border-radius: 20px;
      padding: 0.25rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a7a70;
      white-space: nowrap;
    }
    .summary-chip span { color: var(--green); font-weight: 700; }

    /* ==================== 報告書プレビューオーバーレイ ==================== */
    #service-report-print {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #c8b89a;
      z-index: 1000;
      overflow-y: auto;
    }
    #service-report-print.preview-active { display: block; }

    /* プレビューツールバー */
    .preview-toolbar {
      position: sticky;
      top: 0;
      background: var(--brown-dark);
      color: white;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-wrap: wrap;
    }
    .preview-toolbar .toolbar-title {
      font-size: 0.9rem;
      font-weight: 700;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-preview-close {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 0.42rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-preview-close:hover { background: rgba(255,255,255,0.25); }
    .preview-hint {
      width: 100%;
      font-size: 0.78rem;
      opacity: 0.8;
      padding-top: 0.1rem;
    }

    /* ==================== 報告書ドキュメント（画面＋キャプチャ共通） ==================== */
    .report-doc {
      font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 9pt;
      color: #000;
      line-height: 1.35;
      background: white;
      width: 210mm;
      padding: 8mm 10mm;
      margin: 1.2rem auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .report-title {
      text-align: center;
      font-size: 13pt;
      font-weight: bold;
      border-bottom: 2px solid #333;
      padding-bottom: 4px;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .report-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 9pt;
    }
    .report-info-table td { padding: 1px 6px; }
    .report-info-table td:first-child {
      font-weight: bold;
      white-space: nowrap;
      width: 30%;
      color: #333;
    }
    .report-section { margin-bottom: 8px; }
    .report-section-title {
      font-size: 9.5pt;
      font-weight: bold;
      margin-bottom: 3px;
      padding-left: 5px;
      border-left: 3px solid #555;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.5pt;
      table-layout: fixed;
    }
    .report-table th,
    .report-table td {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
      word-break: break-all;
    }
    .report-table th {
      background: #f2f2f2;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
    }
    /* ①実施したサービス 列幅 */
    .service-table th:nth-child(1), .service-table td:nth-child(1) { width: 22%; }
    .service-table th:nth-child(2), .service-table td:nth-child(2) { width: 28%; }
    .service-table th:nth-child(3), .service-table td:nth-child(3) { width: 50%; }
    /* ②③中止・変更 列幅 */
    .stop-table th:nth-child(1), .stop-table td:nth-child(1) { width: 30%; }
    .stop-table th:nth-child(2), .stop-table td:nth-child(2) { width: 20%; }
    .stop-table th:nth-child(3), .stop-table td:nth-child(3) { width: 50%; }
    /* ④連絡事項 */
    .report-notes-box {
      border: 1px solid #000;
      padding: 5px;
      min-height: 32px;
      font-size: 8.5pt;
    }

    /* ==================== テキスト入力欄（編集時）・印刷用テキスト ==================== */
    /* 編集用テキストエリア：点線枠でユーザーに入力可能を示す */
    .edit-area {
      width: 100%;
      min-height: 2em;
      border: 1.5px dashed #90ade0;
      border-radius: 3px;
      padding: 2px 4px;
      font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 8.5pt;
      color: #000;
      line-height: 1.35;
      resize: vertical;
      background: white;
      box-sizing: border-box;
      outline: none;
      display: block;
    }
    .edit-area:focus {
      border-color: var(--primary);
      background: rgba(231,111,81,0.03);
    }
    /* 印刷用テキスト：通常は非表示。capture-mode 時のみ表示してPDFに映す */
    .print-text {
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 1.2em;
      font-size: 8.5pt;
      line-height: 1.35;
    }
    /* キャプチャモード: textarea を隠し print-text を表示に切り替え */
    .capture-mode .edit-area  { display: none !important; }
    .capture-mode .print-text { display: block !important; }

    /* ==================== タブバー ==================== */
    .tab-bar {
      display: flex;
      background: var(--brown-mid);
      border-bottom: 3px solid var(--primary);
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -3px;
      color: rgba(255,255,255,0.6);
      padding: 0.65rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: white; }
    .tab-btn.active {
      color: white;
      border-bottom-color: var(--primary);
      background: rgba(255,255,255,0.08);
    }

    /* ==================== 過去実績タブ ==================== */
    .history-ctrl {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .history-ctrl label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .history-ctrl select {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      font-size: 0.9rem;
      background: white;
      color: var(--text);
      font-family: inherit;
    }
    #history-months-area { padding: 1rem; }
    .history-empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }
    .history-empty i { font-size: 2rem; display: block; margin-bottom: 0.6rem; color: var(--border); }
    .history-month-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 640px;
    }
    .history-month-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .history-month-item:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(231,111,81,0.15);
    }
    .history-month-item .ym { font-weight: 700; font-size: 1rem; color: var(--text); }
    .history-month-item .saved-at { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .btn-open-report {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-open-report:hover { opacity: 0.85; }

    /* 一括保存ボタン */
    .btn-bulk-save {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-bulk-save:hover { opacity: 0.85; }
    .btn-bulk-save:disabled { opacity: 0.5; cursor: default; }

    /* PDF DLボタン */
    .btn-pdf-dl {
      background: #457b9d;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-pdf-dl:hover { opacity: 0.85; }

    /* 一括保存プログレスオーバーレイ */
    #bulk-progress-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 900;
      align-items: center;
      justify-content: center;
    }
    #bulk-progress-overlay.active { display: flex; }
    .bulk-progress-box {
      background: white;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      min-width: 320px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .bulk-progress-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text); }
    .bulk-progress-bar-wrap {
      background: #eee;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .bulk-progress-bar {
      height: 100%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.3s;
      width: 0%;
    }
    .bulk-progress-label { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>

<!-- ページヘッダー -->
<header class="page-header">
  <i class="fa-solid fa-chart-pie"></i>
  <span class="title">実績報告書</span>
  <span class="subtitle">合同会社 GLAD Life Create</span>
</header>

<!-- タブバー -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-new" onclick="switchTab('new')">
    <i class="fa-solid fa-plus-circle"></i> 新規作成
  </button>
  <button class="tab-btn" id="tab-btn-history" onclick="switchTab('history')">
    <i class="fa-solid fa-clock-rotate-left"></i> 過去実績
  </button>
</div>

<!-- 新規作成タブ -->
<div id="tab-content-new">

<!-- コントロールバー -->
<div class="ctrl-bar">
  <label for="target-month">対象月</label>
  <input type="month" id="target-month">

  <label for="office-filter">事業所</label>
  <select id="office-filter">
    <option value="">全事業所</option>
  </select>

  <button class="btn-primary" id="load-btn" onclick="loadReport()">
    <i class="fa-solid fa-rotate"></i> 表示
  </button>
  <button class="btn-bulk-save hidden" id="bulk-save-btn" onclick="bulkSaveAll()">
    <i class="fa-solid fa-floppy-disk"></i> 一括保存
  </button>
</div>

<!-- 一括保存プログレスオーバーレイ -->
<div id="bulk-progress-overlay">
  <div class="bulk-progress-box">
    <h3><i class="fa-solid fa-floppy-disk" style="color:var(--green)"></i> 一括保存中…</h3>
    <div class="bulk-progress-bar-wrap">
      <div class="bulk-progress-bar" id="bulk-bar"></div>
    </div>
    <div class="bulk-progress-label" id="bulk-label">準備中…</div>
  </div>
</div>

<!-- ローディング -->
<div id="state-loading" class="state-box hidden">
  <div class="spinner"></div>
  <p>データを取得中…</p>
</div>

<!-- 空状態 -->
<div id="state-empty" class="state-box hidden">
  <i class="fa-solid fa-inbox"></i>
  <p>該当するデータが見つかりませんでした。</p>
</div>

<!-- 集計結果 -->
<div id="result-area" class="result-area hidden">
  <div class="pdf-header" id="pdf-header">
    <h2 id="pdf-title"></h2>
    <p id="pdf-subtitle"></p>
  </div>
  <div id="monthly-summary"></div>
  <div id="user-tables"></div>
</div>

</div><!-- /#tab-content-new -->

<!-- 過去実績タブ -->
<div id="tab-content-history" class="hidden">
  <div class="history-ctrl">
    <label for="history-user-sel">利用者</label>
    <select id="history-user-sel" onchange="loadHistoryMonths()">
      <option value="">選択してください</option>
    </select>
    <span id="history-loading" class="hidden" style="font-size:0.85rem;color:var(--muted);display:flex;align-items:center;gap:0.35rem;">
      <i class="fa-solid fa-spinner fa-spin"></i> 読み込み中…
    </span>
  </div>
  <div id="history-months-area">
    <div class="history-empty">
      <i class="fa-solid fa-user-clock"></i>
      利用者を選択すると、保存済みの実績報告書一覧が表示されます
    </div>
  </div>
</div>

<!-- ============================================================
     サービス実施報告書 プレビューオーバーレイ
     ============================================================ -->
<div id="service-report-print"></div>

<script>
  /* =====================================================
   * 設定
   * ===================================================== */
  const isLocal = location.hostname === 'localhost';
  const API_BASE = isLocal ? 'http://localhost:3000' : 'https://attendance-app-irf1.onrender.com';

  const REPORTER_NAME = '砂川　明彦'; // 報告者固定

  let _allRecords     = [];
  let _activeMonthVal = '';
  let _currentUser    = ''; // 現在プレビュー中の利用者名

  // 今月を初期値にセット
  (function () {
    const now = new Date();
    document.getElementById('target-month').value =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  })();

  /* =====================================================
   * 初期化：事業所リストを取得
   * ===================================================== */
  async function init() {
    try {
      const res  = await fetch(`${API_BASE}/api/helper/meta`);
      const data = await res.json();
      if (data.ok && data.officeList) {
        const sel = document.getElementById('office-filter');
        data.officeList.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          sel.appendChild(opt);
        });
      }
    } catch (e) { /* 事業所取得失敗は無視 */ }
  }

  /* =====================================================
   * データ取得・集計・描画
   * ===================================================== */
  async function loadReport() {
    const monthVal = document.getElementById('target-month').value;
    if (!monthVal) { alert('対象月を選択してください。'); return; }

    const [year, month] = monthVal.split('-');
    const officeFilter  = document.getElementById('office-filter').value;

    setView('loading');
    document.getElementById('load-btn').disabled = true;

    try {
      const params = new URLSearchParams({ year, month });
      if (officeFilter) params.set('office', officeFilter);

      const res  = await fetch(`${API_BASE}/api/helper/records?${params}`);
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || '取得失敗');

      const records = data.records || [];
      if (records.length === 0) { setView('empty'); return; }

      _allRecords     = records;
      _activeMonthVal = monthVal;

      renderReport(records, monthVal, officeFilter);
      setView('result');
      document.getElementById('bulk-save-btn').classList.remove('hidden');
    } catch (e) {
      alert(`データ取得エラー: ${e.message}`);
      setView('none');
    } finally {
      document.getElementById('load-btn').disabled = false;
    }
  }

  /* =====================================================
   * 集計ロジック（集計表用）
   * ===================================================== */
  function aggregate(records) {
    const byUser    = new Map();
    const allKlassSet = new Set();

    for (const r of records) {
      const user  = r['氏名']     || '（氏名なし）';
      const task  = r['作業項目'] || '（未分類）';
      const klass = r['記録分類'] || '（未分類）';

      allKlassSet.add(klass);

      if (!byUser.has(user)) byUser.set(user, new Map());
      const byTask = byUser.get(user);
      if (!byTask.has(task)) byTask.set(task, new Map());
      const byKlass = byTask.get(task);
      byKlass.set(klass, (byKlass.get(klass) || 0) + 1);
    }
    return { byUser, allKlass: [...allKlassSet].sort() };
  }

  /* =====================================================
   * 描画
   * ===================================================== */
  function renderReport(records, monthVal, officeFilter) {
    const { byUser, allKlass } = aggregate(records);
    const [y, m]      = monthVal.split('-');
    const label       = `${y}年${parseInt(m, 10)}月`;
    const officeLabel = officeFilter ? `【${officeFilter}】` : '【全事業所】';

    document.getElementById('pdf-title').textContent    = `${label} 実績報告書 ${officeLabel}`;
    document.getElementById('pdf-subtitle').textContent = `出力日: ${formatDate(new Date())}　総件数: ${records.length}件`;

    renderMonthlySummary(records, label, officeLabel);

    const container = document.getElementById('user-tables');
    container.innerHTML = '';
    for (const [userName, byTask] of [...byUser.entries()].sort()) {
      container.appendChild(buildUserSection(userName, byTask, allKlass, monthVal));
    }
  }

  function renderMonthlySummary(records, label, officeLabel) {
    const klassCounts = new Map();
    for (const r of records) {
      const k = r['記録分類'] || '（未分類）';
      klassCounts.set(k, (klassCounts.get(k) || 0) + 1);
    }
    let html = `
      <div class="monthly-summary">
        <div class="monthly-summary-header">
          <i class="fa-solid fa-chart-bar"></i>
          ${label} ${officeLabel} 月間集計サマリー　合計 ${records.length} 件
        </div>
        <div class="monthly-summary-body">`;
    for (const [k, cnt] of [...klassCounts.entries()].sort()) {
      html += `<div class="summary-chip">${escHtml(k)}：<span>${cnt}</span> 件</div>`;
    }
    html += '</div></div>';
    document.getElementById('monthly-summary').innerHTML = html;
  }

  function buildUserSection(userName, byTask, allKlass, monthVal) {
    let userTotal = 0;
    for (const byKlass of byTask.values()) {
      for (const cnt of byKlass.values()) userTotal += cnt;
    }

    const section = document.createElement('div');
    section.className = 'user-section';

    const header = document.createElement('div');
    header.className = 'user-section-header';
    header.innerHTML = `
      <i class="fa-solid fa-user"></i>
      ${escHtml(userName)}
      <span class="user-total-badge">合計 ${userTotal} 件</span>`;
    section.appendChild(header);

    const wrap  = document.createElement('div');
    wrap.className = 'summary-table-wrap';

    const table = document.createElement('table');
    table.className = 'summary-table';
    const userTasks = [...byTask.keys()].sort();

    let thead = '<thead><tr><th>作業項目</th>';
    for (const k of allKlass) thead += `<th>${escHtml(k)}</th>`;
    thead += '<th class="col-total">合計</th></tr></thead>';

    let tbody = '<tbody>';
    for (const task of userTasks) {
      const byKlass = byTask.get(task);
      let rowTotal  = 0;
      let row = `<tr><td class="task-cell" data-user="${escHtml(userName)}" data-month="${escHtml(monthVal || '')}" data-item="${escHtml(task)}">${escHtml(task)}</td>`;
      for (const k of allKlass) {
        const cnt = byKlass.get(k) || 0;
        rowTotal += cnt;
        row += `<td class="${cnt > 0 ? 'has-count' : ''}">${cnt > 0 ? cnt : '－'}</td>`;
      }
      row += `<td class="col-total">${rowTotal}</td></tr>`;
      tbody += row;
    }
    tbody += '</tbody>';

    let tfoot = '<tfoot><tr><td>合　計</td>';
    for (const k of allKlass) {
      let colTotal = 0;
      for (const bk of byTask.values()) colTotal += bk.get(k) || 0;
      tfoot += `<td>${colTotal}</td>`;
    }
    tfoot += `<td class="col-total">${userTotal}</td></tr></tfoot>`;

    table.innerHTML = thead + tbody + tfoot;
    table.querySelectorAll('.task-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        const params = new URLSearchParams({
          user:  cell.dataset.user,
          month: cell.dataset.month,
          item:  cell.dataset.item,
        });
        window.open(`helper-record.html?${params}`, '_blank');
      });
    });

    wrap.appendChild(table);
    section.appendChild(wrap);

    const prominentBtn = document.createElement('button');
    prominentBtn.className = 'btn-report-prominent no-summary-pdf';
    prominentBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> ${escHtml(userName)} の実施報告書PDFを出力する`;
    prominentBtn.addEventListener('click', () => openReportPreview(userName));
    section.appendChild(prominentBtn);

    return section;
  }

  /* =====================================================
   * 報告書プレビューを開く
   * ===================================================== */
  async function openReportPreview(userName) {
    if (!_activeMonthVal) {
      alert('先に「表示」ボタンでデータを読み込んでください。');
      return;
    }
    _currentUser = userName;

    const records = _allRecords.filter(r => r['氏名'] === userName);
    const [y, m]  = _activeMonthVal.split('-');

    // ローディング表示でオーバーレイを開く
    const container = document.getElementById('service-report-print');
    container.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:white;font-size:1.1rem;gap:0.75rem;">' +
      '<i class="fa-solid fa-spinner fa-spin"></i>前月データを取得中…</div>';
    container.classList.add('preview-active');
    document.body.style.overflow = 'hidden';

    // 当月の保存済み報告書を優先取得。なければ前月分を引き継ぎ用に取得する
    let currentReport = null;
    let prevReport    = null;
    try {
      const curParams = new URLSearchParams({ year: y, month: m, name: userName });
      const curRes  = await fetch(`${API_BASE}/api/service-report?${curParams}`);
      const curData = await curRes.json();
      if (curData.ok) currentReport = curData.report;
    } catch (_) {}

    if (!currentReport) {
      // 前月年月を計算（1月→前年12月 も正しく処理）
      const prevDate = new Date(parseInt(y, 10), parseInt(m, 10) - 2, 1);
      const prevY = String(prevDate.getFullYear());
      const prevM = String(prevDate.getMonth() + 1).padStart(2, '0');
      try {
        const prevParams = new URLSearchParams({ year: prevY, month: prevM, name: userName });
        const prevRes  = await fetch(`${API_BASE}/api/service-report?${prevParams}`);
        const prevData = await prevRes.json();
        if (prevData.ok) prevReport = prevData.report;
      } catch (_) {}
    }

    container.innerHTML = buildServiceReportHTML(userName, records, y, m, currentReport, prevReport);
  }

  /* =====================================================
   * 報告書プレビューを閉じる（グローバル参照）
   * ===================================================== */
  function closePreview() {
    const container = document.getElementById('service-report-print');
    container.classList.remove('preview-active', 'capture-mode');
    container.innerHTML = '';
    document.body.style.overflow = '';
    _currentUser = '';
  }

  /* =====================================================
   * サービス実施報告書 HTML 生成
   * ===================================================== */
  // currentReport: 当月の保存済み報告書 { serviceRows:[{task,yosu}] } | null
  // prevReport:    前月の保存済み報告書（当月未保存時の引き継ぎ用）| null
  function buildServiceReportHTML(userName, records, y, m, currentReport = null, prevReport = null) {
    const mInt    = parseInt(m, 10);
    const yInt    = parseInt(y, 10);
    const lastDay = new Date(yInt, mInt, 0).getDate();
    const period  = `${yInt}年${mInt}月1日 〜 ${yInt}年${mInt}月${lastDay}日`;

    // 作業項目ごとに実施日を集計
    const taskMap = new Map();
    for (const r of records) {
      const task = r['作業項目'] || '（未分類）';
      if (!taskMap.has(task)) taskMap.set(task, new Set());
      if (r['実施日']) {
        const jst = new Date(Number(r['実施日']) + 9 * 60 * 60 * 1000);
        taskMap.get(task).add(jst.getUTCDate());
      }
    }

    // 「サービス実施時の様子」の初期値マップを構築する
    // 優先順位: ①当月保存済み → ②前月保存済み → ③デフォルト文言
    const currentYosuByTask = new Map();
    if (currentReport && Array.isArray(currentReport.serviceRows)) {
      for (const row of currentReport.serviceRows) {
        if (row.task) currentYosuByTask.set(row.task.trim(), row.yosu || '');
      }
    }
    const prevYosuByTask = new Map();
    if (prevReport && Array.isArray(prevReport.serviceRows)) {
      for (const row of prevReport.serviceRows) {
        if (row.task) prevYosuByTask.set(row.task.trim(), row.yosu || '');
      }
    }

    // 当月保存済みデータから中止・変更理由と連絡事項の復元マップを構築する
    // キー: "作業項目_日" (例: "入浴介助_5日") でユーザー編集済み理由を優先する
    const stopReasonMap   = new Map();
    const changeReasonMap = new Map();
    let savedNotice = null;
    if (currentReport) {
      for (const row of (currentReport.stopRows || [])) {
        if (row.task) stopReasonMap.set(row.task.trim() + '_' + (row.day || '').trim(), row.reason || '');
      }
      for (const row of (currentReport.changeRows || [])) {
        if (row.task) changeReasonMap.set(row.task.trim() + '_' + (row.day || '').trim(), row.reason || '');
      }
      if (currentReport.notice !== null && currentReport.notice !== undefined) {
        savedNotice = currentReport.notice;
      }
    }

    const DEFAULT_YOSU = '介助にて問題なく実施できております。';

    let serviceRows = '';
    for (const [task, datesSet] of [...taskMap.entries()].sort()) {
      const sortedDates = [...datesSet].sort((a, b) => a - b);
      const datesStr    = sortedDates.length > 0 ? sortedDates.join(', ') + '日' : '－';
      const savedYosu   = currentYosuByTask.get(task.trim()) ?? prevYosuByTask.get(task.trim());
      const initialText = escHtml(savedYosu !== undefined ? savedYosu : DEFAULT_YOSU);
      serviceRows += `
        <tr>
          <td>${escHtml(task)}</td>
          <td style="white-space:pre-wrap">${escHtml(datesStr)}</td>
          <td>
            <textarea class="edit-area" rows="2">${initialText}</textarea>
            <div class="print-text"></div>
          </td>
        </tr>`;
    }
    if (!serviceRows) {
      serviceRows = '<tr><td colspan="3" style="text-align:center">実施記録なし</td></tr>';
    }

    // 「記録分類 = サービス中止」のレコードを抽出して行HTML生成
    // 保存済みの理由があればユーザー編集内容を優先し、なければLark記録内容から自動取得する
    const stopRecords = records.filter(r => r['記録分類'] === 'サービス中止');
    let stopRows = '';
    if (stopRecords.length === 0) {
      stopRows = '<tr><td>なし</td><td></td><td><textarea class="edit-area" rows="2"></textarea><div class="print-text"></div></td></tr>';
    } else {
      for (const r of stopRecords) {
        const rawTask = (r['作業項目'] || '').trim();
        const dayStr  = r['実施日'] ? new Date(Number(r['実施日']) + 9 * 60 * 60 * 1000).getUTCDate() + '日' : '';
        const stopKey = rawTask + '_' + dayStr;
        const rawReason = stopReasonMap.has(stopKey) ? stopReasonMap.get(stopKey) : '';
        stopRows += `
          <tr>
            <td>${escHtml(rawTask)}</td>
            <td>${escHtml(dayStr)}</td>
            <td>
              <textarea class="edit-area" rows="2">${escHtml(rawReason)}</textarea>
              <div class="print-text"></div>
            </td>
          </tr>`;
      }
    }

    // 「記録分類 = 時間変更記録 or 振替記録」のレコードを抽出して行HTML生成
    const changeRecords = records.filter(r => r['記録分類'] === '時間変更記録' || r['記録分類'] === '振替記録');
    let changeRows = '';
    if (changeRecords.length === 0) {
      changeRows = '<tr><td>なし</td><td></td><td><textarea class="edit-area" rows="2"></textarea><div class="print-text"></div></td></tr>';
    } else {
      for (const r of changeRecords) {
        const rawTask   = (r['作業項目'] || '').trim();
        const dayStr    = r['実施日'] ? new Date(Number(r['実施日']) + 9 * 60 * 60 * 1000).getUTCDate() + '日' : '';
        const changeKey = rawTask + '_' + dayStr;
        const rawReason = changeReasonMap.has(changeKey) ? changeReasonMap.get(changeKey) : '';
        changeRows += `
          <tr>
            <td>${escHtml(rawTask)}</td>
            <td>${escHtml(dayStr)}</td>
            <td>
              <textarea class="edit-area" rows="2">${escHtml(rawReason)}</textarea>
              <div class="print-text"></div>
            </td>
          </tr>`;
      }
    }

    const noticeText = escHtml(savedNotice !== null ? savedNotice : '特記事項なし。');

    return `
<div class="preview-toolbar">
  <span class="toolbar-title">
    <i class="fa-solid fa-file-pdf" style="color:#f4a261"></i>
    ${escHtml(userName)} 様 ・ サービス実施報告書（${yInt}年${mInt}月）
  </span>
  <button class="btn-preview-close" onclick="closePreview()">
    <i class="fa-solid fa-xmark"></i> 閉じる
  </button>
  <span class="preview-hint">
    <i class="fa-solid fa-pencil" style="font-size:0.72rem"></i>
    青い点線の枠内にテキストを入力できます（「様子」「中止理由」「変更理由」「連絡事項」）。入力後は「一括保存」ボタンで全員分まとめて保存されます。
  </span>
</div>

<div class="report-doc">
  <h1 class="report-title">訪問介護快護屋　サービス実施報告書</h1>

  <table class="report-info-table">
    <tr><td>報 告 者</td><td>${escHtml(REPORTER_NAME)}</td></tr>
    <tr><td>利用者氏名</td><td>${escHtml(userName)} 様</td></tr>
    <tr><td>サービス提供期間</td><td>${escHtml(period)}</td></tr>
  </table>

  <div class="report-section">
    <h2 class="report-section-title">●実施したサービス</h2>
    <table class="report-table service-table">
      <thead>
        <tr>
          <th>実施サービス内容</th>
          <th>サービス実施日</th>
          <th>サービス実施時の様子</th>
        </tr>
      </thead>
      <tbody>${serviceRows}</tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●サービスの中止</h2>
    <table class="report-table stop-table">
      <thead>
        <tr><th>サービス内容</th><th>中止日</th><th>中止理由</th></tr>
      </thead>
      <tbody>${stopRows}</tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●サービスの変更</h2>
    <table class="report-table stop-table">
      <thead>
        <tr><th>サービス内容</th><th>変更日</th><th>変更理由</th></tr>
      </thead>
      <tbody>${changeRows}</tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●連絡事項</h2>
    <div class="report-notes-box">
      <textarea class="edit-area" rows="3">${noticeText}</textarea>
      <div class="print-text"></div>
    </div>
  </div>
</div>`;
  }

  /* =====================================================
   * ユーティリティ
   * ===================================================== */
  function setView(state) {
    document.getElementById('state-loading').classList.toggle('hidden', state !== 'loading');
    document.getElementById('state-empty').classList.toggle('hidden',   state !== 'empty');
    document.getElementById('result-area').classList.toggle('hidden',   state !== 'result');
  }

  function formatDate(d) {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =====================================================
   * 一括保存：全利用者の報告書データ+PDFを一括生成・保存
   * ===================================================== */
  async function bulkSaveAll() {
    if (!_activeMonthVal || _allRecords.length === 0) {
      alert('先に「表示」ボタンでデータを読み込んでください。');
      return;
    }

    const [y, m] = _activeMonthVal.split('-');
    const users  = [...new Set(_allRecords.map(r => r['氏名']).filter(Boolean))];

    // プログレスオーバーレイを表示する
    const overlay   = document.getElementById('bulk-progress-overlay');
    const bar       = document.getElementById('bulk-bar');
    const label     = document.getElementById('bulk-label');
    const bulkBtn   = document.getElementById('bulk-save-btn');
    overlay.classList.add('active');
    bulkBtn.disabled = true;

    // PDFを生成するための非表示コンテナ
    const tempWrap = document.createElement('div');
    tempWrap.id = '__bulk-render-wrap__';
    tempWrap.style.cssText =
      'position:fixed;left:-9999px;top:0;width:794px;background:white;overflow:visible;z-index:-1;';
    document.body.appendChild(tempWrap);

    let successCount = 0;
    let failCount    = 0;

    for (let i = 0; i < users.length; i++) {
      const userName = users[i];
      const pct      = Math.round((i / users.length) * 100);
      bar.style.width  = pct + '%';
      label.textContent = `${i + 1} / ${users.length}人 … ${userName}`;

      try {
        // 当月の保存済みデータを取得する（なければ null）
        let currentReport = null;
        try {
          const rr = await fetch(`${API_BASE}/api/service-report?${new URLSearchParams({ year: y, month: m, name: userName })}`).then(r => r.json());
          if (rr.ok) currentReport = rr.report;
        } catch (_) {}

        const records = _allRecords.filter(r => r['氏名'] === userName);

        // 報告書HTMLをオフスクリーンコンテナに挿入する
        tempWrap.innerHTML = buildServiceReportHTML(userName, records, y, m, currentReport, null);
        const reportDoc = tempWrap.querySelector('.report-doc');
        if (!reportDoc) throw new Error('report-doc not found');

        // データをtextareaから収集する（capture-mode前に実施）
        const serviceRows = _collectServiceRows(tempWrap);
        const stopRows    = _collectStopChangeRows(tempWrap, 0);
        const changeRows  = _collectStopChangeRows(tempWrap, 1);
        const notice      = tempWrap.querySelector('.report-notes-box .edit-area')?.value || '';

        // textarea値をprint-textにコピーしてcapture-modeに切り替える
        tempWrap.querySelectorAll('.edit-area').forEach(area => {
          const next = area.nextElementSibling;
          if (next?.classList.contains('print-text')) next.textContent = area.value;
        });
        tempWrap.classList.add('capture-mode');

        // レイアウト確定を待つ
        await new Promise(r => requestAnimationFrame(r));
        await new Promise(r => requestAnimationFrame(r));

        // html2canvas でキャプチャする
        const canvas = await html2canvas(reportDoc, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          allowTaint: true,
          logging: false,
          onclone: (clonedDoc) => {
            const c = clonedDoc.getElementById('__bulk-render-wrap__');
            if (c) { c.style.overflow = 'visible'; c.style.position = 'absolute'; }
          },
        });

        tempWrap.classList.remove('capture-mode');

        // jsPDF でA4 1ページPDFを生成する
        const MARGIN = 8, CW = 194, CH = 281;
        const cw = canvas.width / 2, ch = canvas.height / 2;
        const scaleByW = CW / cw;
        const sc = ch * scaleByW > CH ? CH / ch : scaleByW;
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', MARGIN, MARGIN, cw * sc, ch * sc);
        const pdfBase64 = pdf.output('datauristring').split(',')[1];

        // データ保存とPDFアップロードを1回のAPI呼び出しで原子的に実行する（重複レコード防止）
        const saveRes = await fetch(`${API_BASE}/api/service-report/save-all`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ year: y, month: m, name: userName, serviceRows, stopRows, changeRows, notice, pdfBase64 }),
        }).then(r => r.json());

        if (saveRes.ok) {
          successCount++;
        } else {
          console.warn(`[bulkSave] ${userName}: error=${saveRes.error}`);
          failCount++;
        }
      } catch (e) {
        console.error(`[bulkSave] ${userName} エラー:`, e);
        failCount++;
      }
    }

    document.body.removeChild(tempWrap);
    overlay.classList.remove('active');
    bulkBtn.disabled = false;
    bar.style.width  = '100%';

    alert(`一括保存完了\n成功: ${successCount}件 / 失敗: ${failCount}件`);

    // 過去実績タブのユーザーリストをリセットして次回取得時に再ロードさせる
    const sel = document.getElementById('history-user-sel');
    while (sel.options.length > 1) sel.remove(1);
  }

  function _collectServiceRows(container) {
    const rows = [];
    container.querySelectorAll('.service-table tbody tr').forEach(row => {
      const cells = row.querySelectorAll('td');
      if (cells.length < 3) return;
      const task = cells[0].textContent.trim();
      const area = cells[2].querySelector('.edit-area');
      if (task && task !== '実施記録なし') rows.push({ task, yosu: area?.value || '' });
    });
    return rows;
  }

  function _collectStopChangeRows(container, tableIdx) {
    const tables = container.querySelectorAll('.stop-table');
    const rows = [];
    if (!tables[tableIdx]) return rows;
    tables[tableIdx].querySelectorAll('tbody tr').forEach(row => {
      const cells = row.querySelectorAll('td');
      if (cells.length < 3) return;
      const task = cells[0].textContent.trim();
      const day  = cells[1].textContent.trim();
      const area = cells[2].querySelector('.edit-area');
      if (task && task !== 'なし') rows.push({ task, day, reason: area?.value || '' });
    });
    return rows;
  }

  /* =====================================================
   * タブ切り替え
   * ===================================================== */
  function switchTab(tab) {
    ['new', 'history'].forEach(t => {
      document.getElementById(`tab-content-${t}`).classList.toggle('hidden', t !== tab);
      document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
    });
    if (tab === 'history') loadHistoryUsers();
  }

  /* =====================================================
   * 過去実績：利用者一覧を取得してセレクトに反映
   * ===================================================== */
  async function loadHistoryUsers() {
    const sel = document.getElementById('history-user-sel');
    if (sel.options.length > 1) return; // 既に読み込み済み
    const loading = document.getElementById('history-loading');
    loading.classList.remove('hidden');
    try {
      const res  = await fetch(`${API_BASE}/api/service-report/users`);
      const data = await res.json();
      if (data.ok) {
        data.users.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
      }
    } catch (_) {}
    loading.classList.add('hidden');
  }

  /* =====================================================
   * 過去実績：選択利用者の保存月一覧を取得・表示
   * ===================================================== */
  async function loadHistoryMonths() {
    const name    = document.getElementById('history-user-sel').value;
    const area    = document.getElementById('history-months-area');
    const loading = document.getElementById('history-loading');

    if (!name) {
      area.innerHTML = '<div class="history-empty"><i class="fa-solid fa-user-clock"></i>利用者を選択すると、保存済みの実績報告書一覧が表示されます</div>';
      return;
    }

    loading.classList.remove('hidden');
    area.innerHTML = '';

    try {
      const res  = await fetch(`${API_BASE}/api/service-report/months?${new URLSearchParams({ name })}`);
      const data = await res.json();
      loading.classList.add('hidden');

      if (!data.ok || data.months.length === 0) {
        area.innerHTML = '<div class="history-empty"><i class="fa-solid fa-box-open"></i>保存された実績報告書がありません</div>';
        return;
      }

      const list = document.createElement('div');
      list.className = 'history-month-list';

      for (const { yearMonth, savedAt } of data.months) {
        const [y, m] = yearMonth.split('-');
        const label  = `${parseInt(y, 10)}年${parseInt(m, 10)}月`;
        const dateStr = savedAt
          ? new Date(savedAt).toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' })
          : '';

        const item = document.createElement('div');
        item.className = 'history-month-item';
        const dlBtn = hasPdf
          ? `<button class="btn-pdf-dl" onclick="downloadSavedPdf(${JSON.stringify(name)}, ${JSON.stringify(yearMonth)})">
               <i class="fa-solid fa-download"></i> PDF DL
             </button>`
          : '';
        item.innerHTML = `
          <div>
            <div class="ym">${label}</div>
            ${dateStr ? `<div class="saved-at">保存日: ${dateStr}</div>` : ''}
          </div>
          <div style="display:flex;gap:0.4rem;align-items:center;">
            ${dlBtn}
            <button class="btn-open-report" onclick="openHistoryPreview(${JSON.stringify(name)}, ${JSON.stringify(yearMonth)})">
              <i class="fa-solid fa-eye"></i> 閲覧・再生成
            </button>
          </div>`;
        list.appendChild(item);
      }

      area.appendChild(list);
    } catch (e) {
      loading.classList.add('hidden');
      area.innerHTML = `<div class="history-empty">エラー: ${escHtml(e.message)}</div>`;
    }
  }

  /* =====================================================
   * 過去実績：保存済みPDFをダウンロードする
   * ===================================================== */
  function downloadSavedPdf(name, yearMonth) {
    const [y, m] = yearMonth.split('-');
    const url = `${API_BASE}/api/service-report/pdf-download?${new URLSearchParams({ year: y, month: m, name })}`;
    const a   = document.createElement('a');
    a.href    = url;
    a.download = `${y}年${m}月_${name}_実施報告書.pdf`;
    a.target  = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* =====================================================
   * 過去実績：指定月の報告書プレビューを開く
   * ===================================================== */
  async function openHistoryPreview(userName, yearMonth) {
    const [y, m] = yearMonth.split('-');
    const container = document.getElementById('service-report-print');
    container.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:white;font-size:1.1rem;gap:0.75rem;">' +
      '<i class="fa-solid fa-spinner fa-spin"></i>データを取得中…</div>';
    container.classList.add('preview-active');
    document.body.style.overflow = 'hidden';

    // PDF生成・保存で参照されるグローバル変数を設定する
    _currentUser    = userName;
    _activeMonthVal = yearMonth;

    try {
      const [recordsRes, reportRes] = await Promise.all([
        fetch(`${API_BASE}/api/helper/records?${new URLSearchParams({ year: y, month: m, name: userName })}`).then(r => r.json()),
        fetch(`${API_BASE}/api/service-report?${new URLSearchParams({ year: y, month: m, name: userName })}`).then(r => r.json()),
      ]);

      const records     = (recordsRes.ok ? recordsRes.records || [] : []).filter(r => r['氏名'] === userName);
      const savedReport = reportRes.ok ? reportRes.report : null;
      container.innerHTML = buildServiceReportHTML(userName, records, y, m, savedReport, null);
    } catch (e) {
      container.innerHTML =
        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:white;font-size:1rem;padding:2rem;">${escHtml(e.message)}</div>`;
    }
  }

  /* =====================================================
   * 起動
   * ===================================================== */
  init();
</script>
