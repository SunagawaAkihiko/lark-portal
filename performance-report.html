<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>実績報告書</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ==================== 変数・リセット ==================== */
    :root {
      --bg:         #fdf6ec;
      --text:       #4a3f35;
      --muted:      #8c7c6b;
      --primary:    #e76f51;
      --primary-lt: #fcece8;
      --card-bg:    #fff0e3;
      --border:     #dcbfa6;
      --brown-dark: #4a3f35;
      --brown-mid:  #6b4f3a;
      --green:      #2a9d8f;
      --green-lt:   #e6f7f5;
      --blue:       #457b9d;
      --blue-lt:    #edf3f8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 5rem;
    }
    button { cursor: pointer; font-family: inherit; }
    input, select { font-family: inherit; }
    .hidden { display: none !important; }

    /* ==================== ページヘッダー ==================== */
    .page-header {
      background: var(--brown-dark);
      color: white;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .page-header i { font-size: 1.2rem; color: #f4a261; }
    .page-header .title   { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .page-header .subtitle { font-size: 0.75rem; opacity: 0.7; }

    /* ==================== コントロールバー ==================== */
    .ctrl-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .ctrl-bar label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctrl-bar input[type="month"],
    .ctrl-bar select {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      font-size: 0.9rem;
      background: white;
      color: var(--text);
    }
    .ctrl-bar input[type="month"]:focus,
    .ctrl-bar select:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary {
      background: white;
      color: var(--brown-mid);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f0e8e0; }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }

    /* ==================== ローディング / 空状態 ==================== */
    .state-box {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .state-box i { font-size: 2rem; display: block; margin-bottom: 0.6rem; color: var(--border); }
    .spinner {
      display: inline-block;
      width: 2rem; height: 2rem;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 0.6rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==================== 集計結果エリア ==================== */
    .result-area { padding: 1rem; }

    /* 集計PDF用ヘッダー（html2canvas キャプチャ時のみ表示） */
    .pdf-header {
      display: none;
      text-align: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--brown-dark);
    }
    .pdf-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--brown-dark); }
    .pdf-header p  { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    /* 利用者ごとのカード */
    .user-section {
      margin-bottom: 1.5rem;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 4px rgba(139,115,95,0.08);
    }
    .user-section-header {
      background: var(--brown-dark);
      color: white;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .user-section-header i { color: #f4a261; font-size: 0.85rem; }
    .user-total-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
    }
    /* 利用者カード下部の目立つ「報告書PDF」ボタン */
    .btn-report-prominent {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.65rem 1.2rem;
      background: var(--primary);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      border-top: 1px solid rgba(231,111,81,0.3);
      letter-spacing: 0.03em;
    }
    .btn-report-prominent:hover { opacity: 0.85; }

    /* 集計テーブル */
    .summary-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #e4d5c5;
      padding: 0.35rem 0.6rem;
      white-space: nowrap;
    }
    .summary-table thead tr { background: var(--card-bg); }
    .summary-table thead th {
      font-weight: 700;
      color: var(--brown-mid);
      text-align: center;
    }
    .summary-table tbody td:first-child {
      font-weight: 600;
      color: var(--text);
      background: #faf5ef;
      text-align: center;
    }
    .task-cell {
      cursor: pointer;
      color: var(--blue) !important;
      text-decoration: underline;
      text-decoration-style: dashed;
      text-underline-offset: 2px;
    }
    .task-cell:hover { background: var(--blue-lt) !important; }
    .summary-table tbody td { text-align: center; color: var(--muted); }
    .summary-table tbody td.has-count { color: var(--text); font-weight: 600; }
    .summary-table tfoot tr { background: var(--primary-lt); }
    .summary-table tfoot td {
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      border-top: 2px solid var(--primary);
    }
    .summary-table tfoot td:first-child { text-align: left; color: var(--brown-dark); }
    .summary-table .col-total {
      background: #fef3ee;
      font-weight: 700;
      color: var(--primary) !important;
      border-left: 2px solid var(--primary);
    }
    .summary-table tfoot .col-total { background: var(--primary); color: white !important; }

    /* ==================== 月合計サマリー ==================== */
    .monthly-summary {
      margin-bottom: 1.5rem;
      background: var(--green-lt);
      border: 1.5px solid #b2dfdb;
      border-radius: 10px;
      overflow: hidden;
    }
    .monthly-summary-header {
      background: var(--green);
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .monthly-summary-body {
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .summary-chip {
      background: white;
      border: 1px solid #b2dfdb;
      border-radius: 20px;
      padding: 0.25rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a7a70;
      white-space: nowrap;
    }
    .summary-chip span { color: var(--green); font-weight: 700; }

    /* ==================== 報告書プレビューオーバーレイ ==================== */
    #service-report-print {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #c8b89a;
      z-index: 1000;
      overflow-y: auto;
    }
    #service-report-print.preview-active { display: block; }

    /* プレビューツールバー */
    .preview-toolbar {
      position: sticky;
      top: 0;
      background: var(--brown-dark);
      color: white;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-wrap: wrap;
    }
    .preview-toolbar .toolbar-title {
      font-size: 0.9rem;
      font-weight: 700;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-preview-pdf {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.42rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .btn-preview-pdf:hover { opacity: 0.85; }
    .btn-preview-pdf:disabled { opacity: 0.5; cursor: default; }
    .btn-preview-close {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 0.42rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-preview-close:hover { background: rgba(255,255,255,0.25); }
    .preview-hint {
      width: 100%;
      font-size: 0.78rem;
      opacity: 0.8;
      padding-top: 0.1rem;
    }

    /* ==================== 報告書ドキュメント（画面＋キャプチャ共通） ==================== */
    .report-doc {
      font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 9pt;
      color: #000;
      line-height: 1.35;
      background: white;
      width: 210mm;
      padding: 8mm 10mm;
      margin: 1.2rem auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .report-title {
      text-align: center;
      font-size: 13pt;
      font-weight: bold;
      border-bottom: 2px solid #333;
      padding-bottom: 4px;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .report-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 9pt;
    }
    .report-info-table td { padding: 1px 6px; }
    .report-info-table td:first-child {
      font-weight: bold;
      white-space: nowrap;
      width: 30%;
      color: #333;
    }
    .report-section { margin-bottom: 8px; }
    .report-section-title {
      font-size: 9.5pt;
      font-weight: bold;
      margin-bottom: 3px;
      padding-left: 5px;
      border-left: 3px solid #555;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.5pt;
      table-layout: fixed;
    }
    .report-table th,
    .report-table td {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
      word-break: break-all;
    }
    .report-table th {
      background: #f2f2f2;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
    }
    /* ①実施したサービス 列幅 */
    .service-table th:nth-child(1), .service-table td:nth-child(1) { width: 22%; }
    .service-table th:nth-child(2), .service-table td:nth-child(2) { width: 28%; }
    .service-table th:nth-child(3), .service-table td:nth-child(3) { width: 50%; }
    /* ②③中止・変更 列幅 */
    .stop-table th:nth-child(1), .stop-table td:nth-child(1) { width: 30%; }
    .stop-table th:nth-child(2), .stop-table td:nth-child(2) { width: 20%; }
    .stop-table th:nth-child(3), .stop-table td:nth-child(3) { width: 50%; }
    /* ④連絡事項 */
    .report-notes-box {
      border: 1px solid #000;
      padding: 5px;
      min-height: 32px;
      font-size: 8.5pt;
    }

    /* ==================== 編集可能セル ==================== */
    .editable-cell {
      min-height: 1.4em;
      width: 100%;
      outline: none;
      word-break: break-all;
      white-space: pre-wrap;
      cursor: text;
      display: block;
    }
    /* 通常モード（プレビュー中）: 点線で編集可能を示す */
    #service-report-print:not(.capture-mode) .editable-cell {
      border-bottom: 1.5px dashed #90ade0;
    }
    #service-report-print:not(.capture-mode) .editable-cell:focus {
      border-bottom-color: var(--primary);
      background: rgba(231,111,81,0.04);
    }
    /* キャプチャモード: 枠線・背景を除去してクリーンに見せる */
    #service-report-print.capture-mode .editable-cell {
      border: none;
      background: transparent;
      cursor: default;
    }
  </style>
</head>
<body>

<!-- ページヘッダー -->
<header class="page-header">
  <i class="fa-solid fa-chart-pie"></i>
  <span class="title">実績報告書</span>
  <span class="subtitle">合同会社 GLAD Life Create</span>
</header>

<!-- コントロールバー -->
<div class="ctrl-bar">
  <label for="target-month">対象月</label>
  <input type="month" id="target-month">

  <label for="office-filter">事業所</label>
  <select id="office-filter">
    <option value="">全事業所</option>
  </select>

  <button class="btn-primary" id="load-btn" onclick="loadReport()">
    <i class="fa-solid fa-rotate"></i> 表示
  </button>
  <button class="btn-secondary hidden" id="pdf-btn" onclick="downloadSummaryPdf()">
    <i class="fa-solid fa-file-pdf"></i> 集計PDF
  </button>
</div>

<!-- ローディング -->
<div id="state-loading" class="state-box hidden">
  <div class="spinner"></div>
  <p>データを取得中…</p>
</div>

<!-- 空状態 -->
<div id="state-empty" class="state-box hidden">
  <i class="fa-solid fa-inbox"></i>
  <p>該当するデータが見つかりませんでした。</p>
</div>

<!-- 集計結果 -->
<div id="result-area" class="result-area hidden">
  <div class="pdf-header" id="pdf-header">
    <h2 id="pdf-title"></h2>
    <p id="pdf-subtitle"></p>
  </div>
  <div id="monthly-summary"></div>
  <div id="user-tables"></div>
</div>

<!-- ============================================================
     サービス実施報告書 プレビューオーバーレイ
     ============================================================ -->
<div id="service-report-print"></div>

<script>
  /* =====================================================
   * 設定
   * ===================================================== */
  const isLocal = location.hostname === 'localhost';
  const API_BASE = isLocal ? 'http://localhost:3000' : 'https://attendance-app-irf1.onrender.com';

  const REPORTER_NAME = '砂川　明彦'; // 報告者固定

  let _allRecords     = [];
  let _activeMonthVal = '';
  let _currentUser    = ''; // 現在プレビュー中の利用者名

  // 今月を初期値にセット
  (function () {
    const now = new Date();
    document.getElementById('target-month').value =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  })();

  /* =====================================================
   * 初期化：事業所リストを取得
   * ===================================================== */
  async function init() {
    try {
      const res  = await fetch(`${API_BASE}/api/helper/meta`);
      const data = await res.json();
      if (data.ok && data.officeList) {
        const sel = document.getElementById('office-filter');
        data.officeList.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          sel.appendChild(opt);
        });
      }
    } catch (e) { /* 事業所取得失敗は無視 */ }
  }

  /* =====================================================
   * データ取得・集計・描画
   * ===================================================== */
  async function loadReport() {
    const monthVal = document.getElementById('target-month').value;
    if (!monthVal) { alert('対象月を選択してください。'); return; }

    const [year, month] = monthVal.split('-');
    const officeFilter  = document.getElementById('office-filter').value;

    setView('loading');
    document.getElementById('load-btn').disabled = true;

    try {
      const params = new URLSearchParams({ year, month });
      if (officeFilter) params.set('office', officeFilter);

      const res  = await fetch(`${API_BASE}/api/helper/records?${params}`);
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || '取得失敗');

      const records = data.records || [];
      if (records.length === 0) { setView('empty'); return; }

      _allRecords     = records;
      _activeMonthVal = monthVal;

      renderReport(records, monthVal, officeFilter);
      setView('result');
      document.getElementById('pdf-btn').classList.remove('hidden');
    } catch (e) {
      alert(`データ取得エラー: ${e.message}`);
      setView('none');
    } finally {
      document.getElementById('load-btn').disabled = false;
    }
  }

  /* =====================================================
   * 集計ロジック（集計表用）
   * ===================================================== */
  function aggregate(records) {
    const byUser    = new Map();
    const allKlassSet = new Set();

    for (const r of records) {
      const user  = r['氏名']     || '（氏名なし）';
      const task  = r['作業項目'] || '（未分類）';
      const klass = r['記録分類'] || '（未分類）';

      allKlassSet.add(klass);

      if (!byUser.has(user)) byUser.set(user, new Map());
      const byTask = byUser.get(user);
      if (!byTask.has(task)) byTask.set(task, new Map());
      const byKlass = byTask.get(task);
      byKlass.set(klass, (byKlass.get(klass) || 0) + 1);
    }
    return { byUser, allKlass: [...allKlassSet].sort() };
  }

  /* =====================================================
   * 描画
   * ===================================================== */
  function renderReport(records, monthVal, officeFilter) {
    const { byUser, allKlass } = aggregate(records);
    const [y, m]      = monthVal.split('-');
    const label       = `${y}年${parseInt(m, 10)}月`;
    const officeLabel = officeFilter ? `【${officeFilter}】` : '【全事業所】';

    document.getElementById('pdf-title').textContent    = `${label} 実績報告書 ${officeLabel}`;
    document.getElementById('pdf-subtitle').textContent = `出力日: ${formatDate(new Date())}　総件数: ${records.length}件`;

    renderMonthlySummary(records, label, officeLabel);

    const container = document.getElementById('user-tables');
    container.innerHTML = '';
    for (const [userName, byTask] of [...byUser.entries()].sort()) {
      container.appendChild(buildUserSection(userName, byTask, allKlass, monthVal));
    }
  }

  function renderMonthlySummary(records, label, officeLabel) {
    const klassCounts = new Map();
    for (const r of records) {
      const k = r['記録分類'] || '（未分類）';
      klassCounts.set(k, (klassCounts.get(k) || 0) + 1);
    }
    let html = `
      <div class="monthly-summary">
        <div class="monthly-summary-header">
          <i class="fa-solid fa-chart-bar"></i>
          ${label} ${officeLabel} 月間集計サマリー　合計 ${records.length} 件
        </div>
        <div class="monthly-summary-body">`;
    for (const [k, cnt] of [...klassCounts.entries()].sort()) {
      html += `<div class="summary-chip">${escHtml(k)}：<span>${cnt}</span> 件</div>`;
    }
    html += '</div></div>';
    document.getElementById('monthly-summary').innerHTML = html;
  }

  function buildUserSection(userName, byTask, allKlass, monthVal) {
    let userTotal = 0;
    for (const byKlass of byTask.values()) {
      for (const cnt of byKlass.values()) userTotal += cnt;
    }

    const section = document.createElement('div');
    section.className = 'user-section';

    const header = document.createElement('div');
    header.className = 'user-section-header';
    header.innerHTML = `
      <i class="fa-solid fa-user"></i>
      ${escHtml(userName)}
      <span class="user-total-badge">合計 ${userTotal} 件</span>`;
    section.appendChild(header);

    const wrap  = document.createElement('div');
    wrap.className = 'summary-table-wrap';

    const table = document.createElement('table');
    table.className = 'summary-table';
    const userTasks = [...byTask.keys()].sort();

    let thead = '<thead><tr><th>作業項目</th>';
    for (const k of allKlass) thead += `<th>${escHtml(k)}</th>`;
    thead += '<th class="col-total">合計</th></tr></thead>';

    let tbody = '<tbody>';
    for (const task of userTasks) {
      const byKlass = byTask.get(task);
      let rowTotal  = 0;
      let row = `<tr><td class="task-cell" data-user="${escHtml(userName)}" data-month="${escHtml(monthVal || '')}" data-item="${escHtml(task)}">${escHtml(task)}</td>`;
      for (const k of allKlass) {
        const cnt = byKlass.get(k) || 0;
        rowTotal += cnt;
        row += `<td class="${cnt > 0 ? 'has-count' : ''}">${cnt > 0 ? cnt : '－'}</td>`;
      }
      row += `<td class="col-total">${rowTotal}</td></tr>`;
      tbody += row;
    }
    tbody += '</tbody>';

    let tfoot = '<tfoot><tr><td>合　計</td>';
    for (const k of allKlass) {
      let colTotal = 0;
      for (const bk of byTask.values()) colTotal += bk.get(k) || 0;
      tfoot += `<td>${colTotal}</td>`;
    }
    tfoot += `<td class="col-total">${userTotal}</td></tr></tfoot>`;

    table.innerHTML = thead + tbody + tfoot;
    table.querySelectorAll('.task-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        const params = new URLSearchParams({
          user:  cell.dataset.user,
          month: cell.dataset.month,
          item:  cell.dataset.item,
        });
        window.open(`helper-record.html?${params}`, '_blank');
      });
    });

    wrap.appendChild(table);
    section.appendChild(wrap);

    const prominentBtn = document.createElement('button');
    prominentBtn.className = 'btn-report-prominent no-summary-pdf';
    prominentBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> ${escHtml(userName)} の実施報告書PDFを出力する`;
    prominentBtn.addEventListener('click', () => openReportPreview(userName));
    section.appendChild(prominentBtn);

    return section;
  }

  /* =====================================================
   * 集計 PDF（html2canvas + jsPDF）
   * ===================================================== */
  async function downloadSummaryPdf() {
    const btn        = document.getElementById('pdf-btn');
    const resultArea = document.getElementById('result-area');
    const pdfHeader  = document.getElementById('pdf-header');

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 生成中…';

    const reportBtns = document.querySelectorAll('.no-summary-pdf');
    reportBtns.forEach(b => { b.style.visibility = 'hidden'; });
    pdfHeader.style.display = 'block';

    try {
      const canvas = await html2canvas(resultArea, {
        scale: 1.5,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
      });

      const PAGE_W = 194, PAGE_H = 277, MARGIN = 8;
      const csW = canvas.width / 1.5, csH = canvas.height / 1.5;
      const scaleW     = PAGE_W / csW;
      const finalScale = csH * scaleW > PAGE_H ? PAGE_H / csH : scaleW;
      const pageH_px   = PAGE_H / finalScale;
      const numPages   = Math.ceil(csH / pageH_px);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

      for (let i = 0; i < numPages; i++) {
        if (i > 0) pdf.addPage();
        const srcY = Math.round(i * pageH_px * 1.5);
        const srcH = Math.round(Math.min(pageH_px, csH - i * pageH_px) * 1.5);
        const slice = document.createElement('canvas');
        slice.width  = canvas.width;
        slice.height = srcH;
        slice.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
        pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', MARGIN, MARGIN, csW * finalScale, (srcH / 1.5) * finalScale);
      }

      const monthVal = document.getElementById('target-month').value;
      const [y, m]   = monthVal.split('-');
      pdf.save(`${y}年${m}月_実績報告書.pdf`);
    } catch (e) {
      alert(`PDF生成エラー: ${e.message}`);
    } finally {
      pdfHeader.style.display = 'none';
      reportBtns.forEach(b => { b.style.visibility = ''; });
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> 集計PDF';
    }
  }

  /* =====================================================
   * 報告書プレビューを開く
   * ===================================================== */
  function openReportPreview(userName) {
    if (!_activeMonthVal) {
      alert('先に「表示」ボタンでデータを読み込んでください。');
      return;
    }
    _currentUser = userName;

    const records = _allRecords.filter(r => r['氏名'] === userName);
    const [y, m]  = _activeMonthVal.split('-');

    const container = document.getElementById('service-report-print');
    container.innerHTML = buildServiceReportHTML(userName, records, y, m);
    container.classList.add('preview-active');
    document.body.style.overflow = 'hidden';
  }

  /* =====================================================
   * 報告書プレビューを閉じる（グローバル参照）
   * ===================================================== */
  function closePreview() {
    const container = document.getElementById('service-report-print');
    container.classList.remove('preview-active', 'capture-mode');
    container.innerHTML = '';
    document.body.style.overflow = '';
    _currentUser = '';
  }

  /* =====================================================
   * 報告書 PDF 生成（A4 1ページに必ず収める）
   * ===================================================== */
  async function generateReportPdf() {
    const container = document.getElementById('service-report-print');
    const reportDoc = container.querySelector('.report-doc');
    if (!reportDoc) return;

    const btn = document.getElementById('preview-pdf-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 生成中…';

    // キャプチャモードで編集用点線を消す
    container.classList.add('capture-mode');

    try {
      const canvas = await html2canvas(reportDoc, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        allowTaint: true,
        logging: false,
      });

      // A4 縦・余白 8mm
      const MARGIN_MM  = 8;
      const CONTENT_W  = 210 - MARGIN_MM * 2; // 194mm
      const CONTENT_H  = 297 - MARGIN_MM * 2; // 281mm

      const csW = canvas.width  / 2; // CSS px（scale=2 分を戻す）
      const csH = canvas.height / 2;

      // 幅に合わせてスケール計算。高さが溢れる場合は高さ優先に切り替え
      const scaleByW   = CONTENT_W / csW;
      const finalScale = csH * scaleByW > CONTENT_H ? CONTENT_H / csH : scaleByW;

      const imgW = csW * finalScale;
      const imgH = csH * finalScale;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', MARGIN_MM, MARGIN_MM, imgW, imgH);

      const [y, m] = _activeMonthVal.split('-');
      pdf.save(`${y}年${m}月_${_currentUser}_実施報告書.pdf`);
    } catch (e) {
      alert(`PDF生成エラー: ${e.message}`);
    } finally {
      container.classList.remove('capture-mode');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> PDF出力（A4 1ページ）';
    }
  }

  /* =====================================================
   * サービス実施報告書 HTML 生成
   * ===================================================== */
  function buildServiceReportHTML(userName, records, y, m) {
    const mInt    = parseInt(m, 10);
    const yInt    = parseInt(y, 10);
    const lastDay = new Date(yInt, mInt, 0).getDate();
    const period  = `${yInt}年${mInt}月1日 〜 ${yInt}年${mInt}月${lastDay}日`;

    // 作業項目ごとに実施日を集計（特記事項は手動入力に変更）
    const taskMap = new Map();
    for (const r of records) {
      const task = r['作業項目'] || '（未分類）';
      if (!taskMap.has(task)) taskMap.set(task, new Set());
      if (r['実施日']) {
        const jst = new Date(Number(r['実施日']) + 9 * 60 * 60 * 1000);
        taskMap.get(task).add(jst.getUTCDate());
      }
    }

    let serviceRows = '';
    for (const [task, datesSet] of [...taskMap.entries()].sort()) {
      const sortedDates = [...datesSet].sort((a, b) => a - b);
      const datesStr    = sortedDates.length > 0 ? sortedDates.join(', ') + '日' : '－';
      serviceRows += `
        <tr>
          <td>${escHtml(task)}</td>
          <td style="white-space:pre-wrap">${escHtml(datesStr)}</td>
          <td><div class="editable-cell" contenteditable="true">介助にて問題なく実施できております。</div></td>
        </tr>`;
    }
    if (!serviceRows) {
      serviceRows = '<tr><td colspan="3" style="text-align:center">実施記録なし</td></tr>';
    }

    return `
<div class="preview-toolbar">
  <span class="toolbar-title">
    <i class="fa-solid fa-file-pdf" style="color:#f4a261"></i>
    ${escHtml(userName)} 様 ・ サービス実施報告書（${yInt}年${mInt}月）
  </span>
  <button class="btn-preview-pdf" id="preview-pdf-btn" onclick="generateReportPdf()">
    <i class="fa-solid fa-file-pdf"></i> PDF出力（A4 1ページ）
  </button>
  <button class="btn-preview-close" onclick="closePreview()">
    <i class="fa-solid fa-xmark"></i> 閉じる
  </button>
  <span class="preview-hint">
    <i class="fa-solid fa-pencil" style="font-size:0.72rem"></i>
    青い点線のセルは直接タイプして編集できます。入力後に「PDF出力」を押してください。
  </span>
</div>

<div class="report-doc">
  <h1 class="report-title">訪問介護快護屋　サービス実施報告書</h1>

  <table class="report-info-table">
    <tr><td>報 告 者</td><td>${escHtml(REPORTER_NAME)}</td></tr>
    <tr><td>利用者氏名</td><td>${escHtml(userName)} 様</td></tr>
    <tr><td>サービス提供期間</td><td>${escHtml(period)}</td></tr>
  </table>

  <div class="report-section">
    <h2 class="report-section-title">●実施したサービス</h2>
    <table class="report-table service-table">
      <thead>
        <tr>
          <th>実施サービス内容</th>
          <th>サービス実施日</th>
          <th>サービス実施時の様子</th>
        </tr>
      </thead>
      <tbody>${serviceRows}</tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●サービスの中止</h2>
    <table class="report-table stop-table">
      <thead>
        <tr><th>サービス内容</th><th>中止日</th><th>中止理由</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><div class="editable-cell" contenteditable="true">なし</div></td>
          <td><div class="editable-cell" contenteditable="true"></div></td>
          <td><div class="editable-cell" contenteditable="true"></div></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●サービスの変更</h2>
    <table class="report-table stop-table">
      <thead>
        <tr><th>サービス内容</th><th>変更日</th><th>変更理由</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><div class="editable-cell" contenteditable="true">なし</div></td>
          <td><div class="editable-cell" contenteditable="true"></div></td>
          <td><div class="editable-cell" contenteditable="true"></div></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="report-section">
    <h2 class="report-section-title">●連絡事項</h2>
    <div class="report-notes-box editable-cell" contenteditable="true">特記事項なし。</div>
  </div>
</div>`;
  }

  /* =====================================================
   * ユーティリティ
   * ===================================================== */
  function setView(state) {
    document.getElementById('state-loading').classList.toggle('hidden', state !== 'loading');
    document.getElementById('state-empty').classList.toggle('hidden',   state !== 'empty');
    document.getElementById('result-area').classList.toggle('hidden',   state !== 'result');
    if (state !== 'result') document.getElementById('pdf-btn').classList.add('hidden');
  }

  function formatDate(d) {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =====================================================
   * 起動
   * ===================================================== */
  init();
</script>
</body>
