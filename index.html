<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <title>Lark Portal Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
:root {
    --bg-color: #fdf6ec;
    --text-color: #4a3f35;
    --text-muted: #8c7c6b;
    --primary-color: #e76f51;
    --card-bg: #fff0e3;
    --card-border: #dcbfa6;
    --shadow-color: rgba(139, 115, 95, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding-bottom: 50px;
    position: relative;
    z-index: 0;
}

.background-shapes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
}

.shape-1 {
    top: -10%; left: -10%; width: 50vw; height: 50vw;
    background: radial-gradient(circle, #ffe3e0 0%, transparent 70%);
}

.shape-2 {
    bottom: -20%; right: -10%; width: 60vw; height: 60vw;
    background: radial-gradient(circle, #fde4cf 0%, transparent 70%);
}

.shape-3 {
    top: 40%; left: 30%; width: 40vw; height: 40vw;
    background: radial-gradient(circle, #fff1e6 0%, transparent 70%);
}

.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 1.2rem 1rem 3rem;
}

header { text-align: center; margin-bottom: 0.75rem; }
header h1 { font-size: 1.6rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: #3b3026; }
header h1 i { color: var(--primary-color); }
header p { color: var(--text-muted); margin-top: 0.5rem; font-weight: 500; }

.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
}

.card {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.85rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 4px var(--shadow-color);
    transition: all 0.15s ease;
}

.card:hover {
    border-color: var(--primary-color);
    box-shadow: 0 4px 10px rgba(231, 111, 81, 0.2);
    transform: translateX(3px);
    background: #fff8f0;
}

.card-icon {
    flex-shrink: 0;
    font-size: 1.2rem;
    color: #fff;
    background: var(--primary-color);
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(231, 111, 81, 0.3);
}

.card-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.08rem;
}

.card-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #3b3026;
    margin: 0;
    line-height: 1.3;
}

.card-desc {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.4;
}

.section-divider {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.45rem 0.8rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    margin-top: 0.4rem;
}

.section-divider--staff {
    background: #fcece8;
    color: var(--primary-color);
    border-left: 4px solid var(--primary-color);
}

.section-divider--admin {
    background: #4a3f35;
    color: #fff;
    border-left: 4px solid #c9b09a;
}

.section-divider--self {
    background: #e0f4f1;
    color: #1a7f6f;
    border-left: 4px solid #1a7f6f;
}

footer { text-align: center; margin-top: 4rem; color: var(--text-muted); font-size: 0.9rem; }

.container--landscape {
    max-width: 900px;
    padding: 0.8rem 1rem 2rem;
}
.grid--landscape {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.35rem 0.6rem;
}
.grid--landscape .section-divider {
    grid-column: 1 / -1;
}

@media (max-width: 600px) {
    .container:not(.container--landscape) {
        padding: 0.8rem 0.6rem 2rem;
    }
    .container:not(.container--landscape) .card {
        padding: 0.6rem 0.75rem;
    }
}
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-briefcase"></i> お仕事ツール</h1>
        </header>

        <main>
            <div class="grid" id="link-grid">
                <!-- Links will be injected here by JavaScript -->
            </div>
        </main>

        <footer>
            <p>Designed for better productivity.</p>
        </footer>
    </div>

    <script>
const portalLinks = [
    {
        title: "予定カレンダー",
        description: "本日の予定確認とスケジュールの新規登録",
        icon: "fa-calendar-days",
        url: "calendar.html"
    },
    {
        title: "各種データ",
        description: "バイタル、体重、排便、食事摂取量、水分摂取量などのデータ閲覧・登録を行います",
        icon: "fa-database",
        url: "care-record.html"
    },
    {
        title: "ヘルパー記録",
        description: "ヘルパー記録の入力・確認",
        icon: "fa-clipboard-user",
        url: "helper-record.html"
    },
    {
        title: "入居者物品提供",
        description: "入居者へ消耗品を提供した際に使用",
        icon: "fa-box-open",
        url: "consumable-record.html"
    },
    {
        title: "消耗品注文",
        description: "",
        icon: "fa-cart-shopping",
        url: "consumable-order.html"
    },
    {
        title: "物品購入申請",
        description: "新しい物品の購入を提案・申請します",
        icon: "fa-file-invoice-dollar",
        url: "purchase-request.html"
    },
    {
        title: "レク予定・実施報告",
        description: "",
        icon: "fa-users",
        url: "rec-report.html"
    },
    {
        title: "入金確認",
        description: "利用料入金の登録・確認",
        icon: "fa-yen-sign",
        url: "payment-confirm.html"
    },
    {
        title: "入金管理",
        description: "未入金の確認・入金登録・領収書メール送信",
        icon: "fa-yen-sign",
        url: "payment-collection.html",
        adminOnly: true
    },
    {
        title: "お客様情報登録",
        description: "新しい利用者の基本情報・家族情報・住所等を登録します",
        icon: "fa-user-plus",
        url: "customer-register.html",
        adminOnly: true,
        selfEntry: true
    },
    {
        title: "スタッフ入職登録",
        description: "入職時の基本情報・住所・保有資格などを登録します",
        icon: "fa-user-tie",
        url: "staff-register.html",
        adminOnly: true,
        selfEntry: true
    },
    {
        title: "スタッフマイページ",
        description: "給与明細・有休残日数・出勤記録などを本人が確認できます",
        icon: "fa-id-card",
        url: "https://attendance-app-irf1.onrender.com/staff-mypage.html",
        adminOnly: true,
        selfEntry: true
    },
    {
        title: "スタッフ給与設定",
        description: "入職スタッフの雇用形態・手当・シフト・給与情報を設定します",
        icon: "fa-user-gear",
        url: "staff-admin-edit.html",
        adminOnly: true
    },
    {
        title: "顧客別作業設定",
        description: "事業所別の時間割を確認しながら顧客のサービス登録・管理を行います",
        icon: "fa-calendar-check",
        url: "service-schedule.html",
        adminOnly: true
    },
    {
        title: "物品提供管理",
        description: "入居者への物品提供履歴の確認・編集と消耗品マスタの商品登録",
        icon: "fa-box-open",
        url: "supply-admin.html",
        adminOnly: true
    },
    {
        title: "給与・出勤管理",
        description: "給与一覧表・有休管理・出勤簿・保険料設定",
        icon: "fa-money-bill-wave",
        url: "salary-admin.html",
        adminOnly: true
    },
    {
        title: "実績報告書",
        description: "利用者毎・作業項目別・記録分類別の月次集計とPDF出力",
        icon: "fa-chart-pie",
        url: "performance-report.html",
        adminOnly: true
    },
    {
        title: "シフト管理",
        description: "月次シフトの自動作成・手動調整・PDF出力",
        icon: "fa-calendar-alt",
        url: "shift.html",
        adminOnly: true
    },
    {
        title: "入居者情報",
        description: "入居者情報の閲覧・薬手帳の登録ができます",
        icon: "fa-address-card",
        url: "customer-info.html"
    },
    {
        title: "各種マニュアル",
        description: "業務や操作に関するマニュアル",
        icon: "fa-book",
        url: "manual.html"
    },
    {
        title: "BCP（事業継続計画）",
        description: "計画書の閲覧・印刷と机上訓練の記録",
        icon: "fa-shield-halved",
        url: "https://attendance-app-irf1.onrender.com/bcp.html"
    }
];

function createSectionDivider(type) {
    var div = document.createElement('div');
    if (type === 'staff') {
        div.className = 'section-divider section-divider--staff';
        div.innerHTML = '<i class="fa-solid fa-users"></i> スタッフ共通ツール';
    } else if (type === 'admin') {
        div.className = 'section-divider section-divider--admin';
        div.innerHTML = '<i class="fa-solid fa-lock"></i> 管理者専用ツール';
    } else {
        div.className = 'section-divider section-divider--self';
        div.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> ご本人入力フォーム';
    }
    return div;
}

function buildDashboard() {
    var grid = document.getElementById('link-grid');
    grid.innerHTML = '';

    var staffLinks = portalLinks.filter(function(link) { return !link.adminOnly; });
    var selfLinks  = portalLinks.filter(function(link) { return  link.adminOnly &&  link.selfEntry; });
    var adminLinks = portalLinks.filter(function(link) { return  link.adminOnly && !link.selfEntry; });

    if (window.ADMIN_MODE === true) {
        grid.appendChild(createSectionDivider('staff'));
        staffLinks.forEach(function(link) { grid.appendChild(createCard(link)); });
        grid.appendChild(createSectionDivider('admin'));
        adminLinks.forEach(function(link) { grid.appendChild(createCard(link)); });
        grid.appendChild(createSectionDivider('self'));
        selfLinks.forEach(function(link) { grid.appendChild(createCard(link)); });
    } else {
        staffLinks.forEach(function(link) { grid.appendChild(createCard(link)); });
    }
}

function createCard(link) {
    var card = document.createElement('a');
    card.className = 'card';
    var url = window.ADMIN_MODE && link.url.endsWith('.html')
        ? link.url + '?mode=admin'
        : link.url;
    card.href = url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.innerHTML =
        '<div class="card-icon"><i class="fa-solid ' + link.icon + '"></i></div>' +
        '<div class="card-text"><h2 class="card-title">' + link.title + '</h2>' +
        (link.description ? '<p class="card-desc">' + link.description + '</p>' : '') +
        '</div>';
    return card;
}

function syncLayout() {
    var isLandscape = window.innerWidth > window.innerHeight;
    var container   = document.querySelector('.container');
    var grid        = document.getElementById('link-grid');
    if (!container || !grid) return;
    container.classList.toggle('container--landscape', isLandscape);
    grid.classList.toggle('grid--landscape', isLandscape);
}

buildDashboard();
syncLayout();

window.addEventListener('resize', syncLayout);

(function () {
    var meta = document.querySelector('meta[name="viewport"]');
    if (!meta) return;
    var BASE = 'width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover';
    window.addEventListener('orientationchange', function() {
        meta.content = 'width=1, initial-scale=1';
        setTimeout(function() {
            meta.content = BASE;
            setTimeout(syncLayout, 50);
        }, 150);
    });
}());
    </script>
</body>
</html>
